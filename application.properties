spring.application.name=geren
server.port=8080

# H2 内置文件数据库（数据保存在 ./data/kb.mv.db）
spring.datasource.url=jdbc:h2:file:./data/kb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 文件上传
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=./data/uploads

# JWT
app.jwt-secret=geren-kb-jwt-secret-key-please-change-in-prod-0123456789
app.jwt-expire-hours=72

# 大模型（可选，OpenAI 兼容接口；api-key 留空则使用内置本地向量+检索增强回答）
app.llm.api-key=
app.llm.base-url=https://api.openai.com/v1
app.llm.model=gpt-4o-mini
app.llm.embedding-model=text-embedding-3-small
